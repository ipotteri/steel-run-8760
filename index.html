<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steel Run 8760</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#05060f;--red:#e30613;--yel:#ffd400;--gry:#8d949e;--ink:#e8ecf5;--panel:rgba(5,6,15,.92)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Press Start 2P',ui-monospace,Menlo,monospace;font-size:10px;line-height:1.8;display:flex;justify-content:center;padding:12px}
#wrap{position:relative;width:min(100%,960px)}
canvas{display:block;width:100%;image-rendering:pixelated;background:#000;border:3px solid #222a55;touch-action:none}
#ov{position:absolute;inset:3px;display:flex;overflow:auto;background:var(--panel)}
#ov[hidden]{display:none}
.panel{margin:auto;padding:14px;text-align:center;max-width:100%;width:420px}
h1{font-size:18px;margin:0 0 8px;color:var(--red)} h1 b{color:#fff}
h2{font-size:14px;margin:0 0 8px} h3{font-size:11px;color:var(--yel);margin:14px 0 6px}
.win{color:var(--yel)} .lose{color:var(--red)}
p{margin:6px 0}.hint{color:var(--gry);font-size:8px}
input,select{font:inherit;background:#0d1230;color:var(--ink);border:2px solid #3a4580;padding:8px;width:100%;margin:4px 0}
button{font:inherit;background:var(--red);color:#fff;border:0;padding:10px 14px;margin:6px 4px 0;box-shadow:0 4px 0 #7a030b;cursor:pointer}
button.sec{background:#2a3266;box-shadow:0 4px 0 #151a3d}
button:active{transform:translateY(2px)}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.row{display:flex;gap:6px;align-items:center}.row select{flex:1}
ol{list-style:none;margin:0;padding:0;text-align:left;font-size:9px}
li{display:grid;grid-template-columns:3ch 1fr auto 5ch;gap:6px;padding:2px 4px}
li.me{color:var(--yel);background:#1a1f45}
li span:last-child{color:var(--gry);text-align:right}
</style></head><body>
<div id="wrap"><canvas id="c"></canvas><div id="ov"></div></div>
<script>
const W=320,H=200,LEN=7000,Y='#ffd400',G='#8d949e',R='#e30613';
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov');
cv.width=W;cv.height=H;
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let nicks=ld('flt-nicks',[]),scores=ld('flt-scores',[]);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let st='menu',dist=0,ship,obs=[],t0=0,last=0,me='',tgt=null,entry=null,score=0;
const keys={},stars=Array.from({length:60},(_,i)=>{const r=mul(i+9);return{x:r()*W,y:14+r()*172,z:.1+r()*.5,c:r()<.3?'#ffd400':'#9aa6d8'}});
const F={'8':'111101111101111','7':'111001001001001','6':'111100111101111','0':'111101101101111'};
function px(s,x,y,c){g.fillStyle=c;[...s].forEach((ch,i)=>{const d=F[ch];for(let k=0;k<15;k++)if(d[k]==='1')g.fillRect(x+i*4+k%3,y+(k/3|0),1,1)})}
function gen(){const r=mul(1760);let x=420,a=[];
 while(x<LEN-200){const p=x/LEN,top=r()<.5;
  if(r()<.5)a.push({k:'r',x,top,L:26+r()*16,ph:r()*6,amp:12+r()*12});
  else a.push({k:'m',x,top,w:30,h:24+r()*22});
  x+=Math.max(55,120-70*p+r()*50)}
 const q=mul(8760);let d=320;
 while(d<LEN-300){const p=d/LEN,s=1.4+q()*.8;
  a.push({k:'f',x:320+d*s,s,y:24+q()*(H-48),r:5+(q()*5|0),ph:q()*6,amp:q()*(8+18*p)});
  d+=Math.max(60,170-90*p+q()*80)}
 return a}
function box(o,tm){
 if(o.k==='f'){const cx=o.x-dist*o.s,cy=clamp(o.y+o.amp*Math.sin(o.ph+tm*2.5),14+o.r,H-14-o.r);return[cx-o.r+1,cy-o.r+1,2*o.r-2,2*o.r-2]}
 const x=o.x-dist;
 if(o.k==='m')return[x,o.top?12:H-12-o.h,o.w,o.h];
 const hh=13+o.L+o.amp*Math.sin(o.ph+tm*3);return[x,o.top?12:H-12-hh,16,hh]}
function drawObs(o,tm){const[x,y,w,h]=box(o,tm);if(x>W||x<-40)return;
 if(o.k==='f'){const cx=Math.round(x+w/2),cy=Math.round(y+h/2),r=o.r;
  for(let j=-r;j<=r;j++){const hw=Math.round(Math.sqrt(r*r-j*j));g.fillStyle='#4d6591';g.fillRect(cx-hw,cy+j,hw*2,1)}
  for(let j=-r+2;j<=r-2;j++){const hw=Math.round(Math.sqrt((r-2)*(r-2)-j*j));g.fillStyle='#9fb7d9';g.fillRect(cx-hw,cy+j,hw*2,1)}
  g.fillStyle='#1c2230';g.fillRect(cx-1,cy-1,3,3);g.fillStyle='#fff';g.fillRect(cx-r+3,cy-r+3,2,1);return}
 if(o.k==='m'){g.fillStyle=G;g.fillRect(x,y,w,h);g.fillStyle='#5d636d';g.fillRect(x+3,y+3,w-14,h-6);
  g.fillStyle='#1c2230';g.fillRect(x+w-11,y+4,8,7);g.fillStyle='#c9d1da';
  for(let i=0;i<h;i+=4)g.fillRect(x-3,y+i,3,2)}
 else{const t=o.top,by=t?y:y+h-10;g.fillStyle=Y;g.fillRect(x,by,16,10);g.fillRect(x+5,t?y+10:y+3,6,h-13);
  const gy=t?y+h-4:y;g.fillRect(x+2,gy,4,4);g.fillRect(x+10,gy,4,4);
  g.fillStyle='#1c1700';g.fillRect(x+3,by+3,4,3);g.fillRect(x+9,by+3,4,3)}}
function drawShip(x,y,tm){const fl=(tm*20|0)%2;
 g.fillStyle=fl?Y:'#ff8a00';g.fillRect(x-5,y-2,5,4);g.fillStyle='#fff';g.fillRect(x-3,y-1,3,2);
 g.fillStyle=R;
 for(let i=0;i<28;i++){const hh=i<19?6:Math.max(0,Math.round(6-(i-18)*.7));g.fillRect(x+i,y-hh,1,hh*2+1)}
 g.fillStyle='#9c0410';g.fillRect(x,y+4,18,2);g.fillRect(x,y-6,18,1);
 px('8760',x+3,y-2,'#fff')}
function overlap(a,b){return a[0]<b[0]+b[2]&&a[0]+a[2]>b[0]&&a[1]<b[1]+b[3]&&a[1]+a[3]>b[1]}
function upd(dt){const tm=(performance.now()-t0)/1000,sp=70+140*Math.pow(dist/LEN,1.1);dist+=sp*dt;
 let dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
 if(tgt){const ex=tgt.x-(ship.x+14),ey=tgt.y-ship.y;dx=Math.abs(ex)>3?Math.sign(ex):0;dy=Math.abs(ey)>3?Math.sign(ey):0}
 ship.x=clamp(ship.x+dx*100*dt,10,150);ship.y=clamp(ship.y+dy*100*dt,19,H-19);
 const sb=[ship.x+2,ship.y-5,24,10];
 for(const o of obs)if(overlap(sb,box(o,tm))){return end(false)}
 if(ship.x+26>=LEN-dist)end(true)}
function bg(tm){g.fillStyle='#05060f';g.fillRect(0,0,W,H);
 for(const s of stars){const x=((s.x-dist*s.z)%W+W)%W;g.fillStyle=s.c;g.fillRect(x|0,s.y|0,1,1)}
 g.fillStyle='#141a38';g.fillRect(0,0,W,12);g.fillRect(0,H-12,W,12);g.fillStyle='#2a3266';
 for(let i=-1;i<21;i++){const x=i*16-(dist%16);g.fillRect(x,10,8,2);g.fillRect(x+8,H-12,8,2)}}
function draw(ts){const tm=ts/1000;bg(tm);
 if(st==='play'||st==='over'){
  const fx=LEN-dist;if(fx<W){for(let yy=12;yy<H-12;yy+=4)for(let k=0;k<2;k++){g.fillStyle=((yy/4+k)%2)?'#fff':'#000';g.fillRect(fx+k*4,yy,4,4)}}
  const t2=(performance.now()-t0)/1000;obs.forEach(o=>drawObs(o,t2));
  drawShip(ship.x,ship.y,tm);
  g.font='bold 8px monospace';g.fillStyle='#fff';g.textBaseline='top';
  g.fillText(`${me}  ${Math.min(100,dist/LEN*100|0)}%  SCORE ${Math.floor(dist/10)}`,4,2)}}
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
 if(st==='play')upd(dt);else if(st==='menu')dist+=40*dt;draw(ts)}
function board(){const top=scores.slice(0,10);
 return`<h3>FLT Score Board</h3>`+(top.length?`<ol>${top.map((s,i)=>`<li class="${s===entry?'me':''}"><span>${i+1}.</span><span>${esc(s.name)}</span><span>${s.score}</span><span>${s.win?'WIN':''}</span></li>`).join('')}</ol>`:'<p class="hint">No scores yet. Be the first!</p>')}
function menu(){st='menu';dist=0;ov.hidden=false;
 ov.innerHTML=`<div class="panel"><h1>STEEL RUN <b>8760</b></h1><p>Steer the 8760 past the steel-eating machines and robots. Dodge the round steel pallets flying at you!</p>
 <label>Nickname<input id="nm" maxlength="12" autocomplete="off" value="${esc(me)}"></label>
 ${nicks.length?`<div class="row"><select id="sel" aria-label="Saved nicknames"><option value="">Saved nicknames</option>${nicks.map(n=>`<option>${esc(n)}</option>`).join('')}</select><button class="sec" id="rm">Remove</button></div>`:''}
 <button id="go">Start</button><p class="hint">Arrows / WASD or drag to steer. The speed keeps rising.</p>${board()}</div>`;
 const nm=document.getElementById('nm');
 const sel=document.getElementById('sel');
 if(sel){sel.onchange=()=>{if(sel.value)nm.value=sel.value};
  document.getElementById('rm').onclick=()=>{if(!sel.value)return;nicks=nicks.filter(n=>n!==sel.value);sv('flt-nicks',nicks);me=nm.value;menu()}}
 document.getElementById('go').onclick=()=>{const v=nm.value.trim();if(!v){nm.focus();return}me=v;start()};
 nm.onkeydown=e=>{if(e.key==='Enter')document.getElementById('go').click()}}
function start(){if(!nicks.includes(me)){nicks.push(me);sv('flt-nicks',nicks)}
 dist=0;ship={x:40,y:H/2};obs=gen();t0=performance.now();tgt=null;ov.hidden=true;st='play'}
function end(win){const tm=(performance.now()-t0);score=Math.floor(dist/10);
 if(win)score+=1000+Math.max(0,6000-Math.floor(tm/10));
 entry={name:me,score,win};scores.push(entry);scores.sort((a,b)=>b.score-a.score);scores=scores.slice(0,50);sv('flt-scores',scores);
 st='over';ov.hidden=false;
 ov.innerHTML=`<div class="panel"><h2 class="${win?'win':'lose'}">${win?'Productivity partner, you win!':'Single-source wins!'}</h2><p>${esc(me)}: ${score} pts</p>
 <button id="again">Fly again</button><button class="sec" id="mn">Menu</button>${board()}</div>`;
 document.getElementById('again').onclick=start;document.getElementById('mn').onclick=menu;document.getElementById('again').focus()}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;
 if(k.startsWith('arrow')||k===' ')if(st!=='menu')e.preventDefault();
 if(st==='over'&&(k==='enter'||k===' ')){e.preventDefault();start()}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
const pt=e=>{const r=cv.getBoundingClientRect();tgt={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
cv.addEventListener('pointerdown',e=>{if(st==='play')pt(e)});
cv.addEventListener('pointermove',e=>{if(st==='play'&&tgt)pt(e)});
addEventListener('pointerup',()=>{tgt=null});
menu();requestAnimationFrame(frame);
</script></body></html>
